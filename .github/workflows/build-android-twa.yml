name: Build Signed Android APK & AAB (Capacitor)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "public/.well-known/assetlinks.json"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release Version Name (leave blank to auto-generate)"
        required: false
        type: string
      version_code:
        description: "Integer Version Code (leave blank to auto-use GitHub run number)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi

          VERSION_CODE="${{ inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="${{ github.run_number }}"
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36"

      - name: Install dependencies and build web bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          npm install
          node -e '
            const fs = require("node:fs");
            async function ensureFirebaseRuntime() {
              const localContent = fs.existsSync("firebase-runtime-config.js")
                ? fs.readFileSync("firebase-runtime-config.js", "utf8")
                : "";
              const hasLocalApiKey = /apiKey:\s*["\x27][^"\x27]+["\x27]/.test(localContent);
              if (hasLocalApiKey || process.env.VITE_FIREBASE_API_KEY) return;
              try {
                const res = await fetch("https://feastareact-nine.vercel.app/firebase-runtime-config.js");
                if (res.ok) {
                  const text = await res.text();
                  if (/apiKey:\s*["\x27][^"\x27]+["\x27]/.test(text)) {
                    fs.writeFileSync("firebase-runtime-config.js", text, "utf8");
                    console.log("Synced firebase-runtime-config.js from live deployment for Capacitor APK.");
                  }
                }
              } catch {}
            }
            ensureFirebaseRuntime();
          '
          npm run build
          npx cap sync android

      - name: Prepare Android signing keystore
        id: keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/feastport.keystore
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "using_persistent_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Generating an ephemeral keystore; add persistent keystore secrets for seamless app updates."
            keytool -genkeypair -v \
              -keystore android/app/feastport.keystore \
              -alias feastport \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass feastport123 -keypass feastport123 \
              -dname "CN=Feastport, OU=Festival, O=Feastport, L=City, S=State, C=IN"
            echo "KEY_ALIAS=feastport" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=feastport123" >> "$GITHUB_ENV"
            echo "KEY_PASS=feastport123" >> "$GITHUB_ENV"
            echo "using_persistent_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Android APK & AAB via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}" \
            -PappVersionName="${{ steps.meta.outputs.version_name }}" \
            -PsigningStoreFile="$PWD/app/feastport.keystore" \
            -PsigningStorePassword="$KEYSTORE_PASS" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASS"

          mkdir -p ../android-dist
          cp app/build/outputs/apk/release/app-release.apk ../android-dist/feastport.apk
          cp app/build/outputs/apk/release/app-release.apk ../android-dist/app-release-signed.apk
          cp app/build/outputs/bundle/release/app-release.aab ../android-dist/feastport.aab
          cp app/build/outputs/bundle/release/app-release.aab ../android-dist/app-release-bundle.aab

      - name: Upload Android APK & AAB workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: feastport-android-packages
          path: |
            android-dist/feastport.apk
            android-dist/feastport.aab
            android-dist/app-release-signed.apk
            android-dist/app-release-bundle.aab
          retention-days: 30

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_name }}" ]; then
            echo "tag=android-v${{ steps.meta.outputs.version_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release with APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.release_tag.outputs.tag }}"
          name: "Feastport Android v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})"
          make_latest: true
          files: |
            android-dist/feastport.apk
            android-dist/feastport.aab
            android-dist/app-release-signed.apk
            android-dist/app-release-bundle.aab

      - name: Write build summary
        run: |
          {
            echo "## Feastport Native Capacitor Android Build Summary"
            echo ""
            echo "- **Build Mode**: Standalone Capacitor Android APK (no browser bar)"
            echo "- **Package ID**: \`com.feastport.app\`"
            echo "- **Version**: \`${{ steps.meta.outputs.version_name }}\` (Code \`${{ steps.meta.outputs.version_code }}\`)"
            echo "- **Persistent Keystore**: \`${{ steps.keystore.outputs.using_persistent_keystore }}\`"
            echo ""
            echo "### Direct APK Download URL"
            echo "\`\`\`"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/feastport.apk"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
